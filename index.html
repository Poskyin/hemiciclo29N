<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Programas, encuestas, simulador de escaños del Congreso y del Senado y mapa de las elecciones generales del 29 de noviembre de 2026.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Two-Hemiciclo 29N</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra fija con pestañas + una sola columna de trabajo (máx. 1180px); los datos mandan, el color es de los partidos. */
:root{
  --paper:#F4F5F2; --card:#FFFFFF; --ink:#15171C; --muted:#5C616B; --line:#D9DCE0; --soft:#ECEEEA;
  --mark:#FFD23F; --mark-ink:#15171C; --good:#1E7A4C; --warn:#A35B00;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#101216; --card:#171A20; --ink:#ECEEF1; --muted:#A1A7B1; --line:#2B3038; --soft:#1D2027;
  --mark:#FFD23F; --mark-ink:#15171C; --good:#5FC891; --warn:#F0A64A; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#101216; --card:#171A20; --ink:#ECEEF1; --muted:#A1A7B1; --line:#2B3038; --soft:#1D2027;
  --mark:#FFD23F; --mark-ink:#15171C; --good:#5FC891; --warn:#F0A64A; color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.55; margin:0}
a{color:inherit; text-underline-offset:3px}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--mark); outline-offset:2px; border-radius:4px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display); font-weight:800; line-height:1; letter-spacing:.01em; text-wrap:balance; margin:0}
h2{font-size:clamp(30px,5vw,44px); text-transform:uppercase}
h3{font-size:22px; text-transform:uppercase; letter-spacing:.02em}
p{margin:0}
.eyebrow{font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- Barra superior ---------- */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--paper); border-bottom:1px solid var(--line)}
.top-in{max-width:1180px; margin:0 auto; padding:10px 16px 0; display:flex; flex-direction:column; gap:8px}
.brand-row{display:flex; align-items:center; justify-content:space-between; gap:4px 12px; flex-wrap:wrap}
.count{margin-left:auto}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none}
.logo-mark{height:32px; width:auto; flex:none; fill:var(--ink)}
@media (max-width:480px){ .logo-mark{height:22px} .brand{gap:7px} .brand b{font-size:21px} .count{font-size:11px} .count strong{font-size:18px} }
.brand b{white-space:nowrap}
.brand-row{min-width:0}
.brand b{font-family:var(--display); font-weight:900; font-size:28px; letter-spacing:.02em; text-transform:uppercase}
.brand b span{background:var(--mark); color:var(--mark-ink); padding:0 6px; margin-left:4px}
.count{font-size:13px; color:var(--muted); white-space:nowrap}
.count strong{font-family:var(--display); font-size:22px; color:var(--ink); font-weight:800}
.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; margin:0 -16px; padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none; background:none; border:0; padding:10px 12px 11px; font-weight:600; font-size:14px; color:var(--muted); cursor:pointer; white-space:nowrap; border-bottom:4px solid transparent}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--ink)}

/* ---------- Página ---------- */
main{max-width:1180px; margin:0 auto; padding-inline:16px; padding-block:28px 64px}
[hidden]{display:none !important}
.view{display:flex; flex-direction:column; gap:28px}
.view-head{display:flex; flex-direction:column; gap:8px; max-width:70ch}
.lead{font-size:17px; color:var(--muted)}
.panel{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:20px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); gap:20px}
.grid3{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:16px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.stack{display:flex; flex-direction:column; gap:12px}
.minw0{min-width:0}
.note{font-size:13px; color:var(--muted); border-left:3px solid var(--line); padding-left:10px}
.flag{display:inline-block; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:2px 7px; border-radius:99px; border:1px solid var(--line); color:var(--muted); white-space:nowrap}
.flag.t2026{border-color:var(--ink); color:var(--ink)}
.flag.t2023{border-style:dashed}
.flag.tvoto{background:var(--soft)}
.flag.tdoc{border-color:var(--muted)}
.btn{appearance:none; border:1px solid var(--ink); background:var(--ink); color:var(--paper); padding:9px 14px; border-radius:8px; font-weight:600; cursor:pointer}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn:disabled{opacity:.45; cursor:default}
.chip{appearance:none; display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--card); padding:6px 11px; border-radius:99px; font-size:13px; font-weight:600; cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.dot{width:10px; height:10px; border-radius:50%; flex:none; display:inline-block}

/* ---------- Resumen ---------- */
.hero{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:28px; align-items:center}
.hero h1{font-size:clamp(44px,8vw,92px); text-transform:uppercase; letter-spacing:-.005em}
.hero h1 em{font-style:normal; background:var(--mark); color:var(--mark-ink); padding:0 .12em}
.hero-facts{display:flex; gap:22px; flex-wrap:wrap; margin-top:18px}
.fact b{display:block; font-family:var(--display); font-size:34px; font-weight:800; line-height:1}
.fact span{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em}
.blocs{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr)); gap:12px}
.bloc{border:1px solid var(--line); border-radius:var(--r); padding:14px; background:var(--card); display:flex; flex-direction:column; gap:8px}
.bloc .n{font-family:var(--display); font-size:40px; font-weight:800; line-height:1}
.bloc .lbl{font-size:13px; font-weight:600}
.state{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:2px 8px; border-radius:99px; align-self:flex-start}
.state.ok{background:color-mix(in srgb,var(--good) 18%,transparent); color:var(--good)}
.state.no{background:var(--soft); color:var(--muted)}
.meter{height:8px; background:var(--soft); border-radius:99px; position:relative; overflow:hidden}
.meter i{position:absolute; inset:0 auto 0 0; background:var(--ink); border-radius:99px}
.meter .maj{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--mark); left:50.29%}
.timeline{display:flex; flex-direction:column; gap:0; border-left:2px solid var(--line); margin-left:6px}
.tl{position:relative; padding:0 0 16px 18px}
.tl::before{content:""; position:absolute; left:-7px; top:6px; width:12px; height:12px; border-radius:50%; background:var(--paper); border:2px solid var(--ink)}
.tl b{display:block; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.next3{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr)); gap:12px}
.date-card{border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; background:var(--card)}
.date-card .dd{font-family:var(--display); font-weight:800; font-size:30px; line-height:1}
.date-card .mm{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}

/* barras de estimación */
.bars{display:flex; flex-direction:column; gap:9px}
.bar{display:grid; grid-template-columns:86px minmax(0,1fr) 54px; gap:10px; align-items:center; font-size:14px}
.bar .tr{height:16px; background:var(--soft); border-radius:3px; position:relative}
.bar .tr i{position:absolute; left:0; top:0; bottom:0; border-radius:3px}
.bar .v{text-align:right; font-weight:700}
.bar .nm{font-weight:600; display:flex; align-items:center; gap:7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

/* hemiciclo */
.hemi{width:100%; height:auto; display:block}
.hemi-wrap{position:relative}
.hemi-legend{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px}
.hemi-legend span{display:inline-flex; align-items:center; gap:6px}
.hemi-legend b{font-variant-numeric:tabular-nums}

/* ---------- Partidos ---------- */
.party-pick{display:flex; flex-wrap:wrap; gap:8px}
.party-pick .chip .dot{width:12px; height:12px}
.ballot{background:#FFFFFF; color:#15171C; border:1px solid #C9CCD1; border-radius:4px; padding:18px 20px; box-shadow:0 1px 0 rgba(0,0,0,.04); display:flex; flex-direction:column; gap:6px; position:relative; overflow:hidden}
.ballot::after{content:""; position:absolute; right:-30px; top:-30px; width:90px; height:90px; border-radius:50%; background:var(--pc); opacity:.9}
.ballot small{max-width:78%; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#5C616B}
.ballot .pname{font-family:var(--display); font-weight:900; font-size:clamp(32px,6vw,52px); text-transform:uppercase; line-height:.95; max-width:85%}
.ballot .cand{font-weight:600}
.ballot .facts{display:flex; gap:18px; flex-wrap:wrap; font-size:13px; color:#3B3F47; margin-top:6px}
.prog{display:flex; flex-direction:column; gap:14px}
.prog-block{border-top:1px solid var(--line); padding-top:14px; display:grid; grid-template-columns:200px minmax(0,1fr); gap:16px}
.prog-block h4{margin:0; font-size:15px; display:flex; flex-direction:column; gap:6px; align-items:flex-start}
.prog-block ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px}
.new{display:inline-block; margin-left:6px; font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; background:var(--mark); color:#15171C; padding:1px 6px; border-radius:99px; vertical-align:1px}
.news{display:flex; flex-direction:column; gap:0; padding-block:6px}
.news-item{display:grid; grid-template-columns:76px minmax(0,1fr); gap:12px; padding:9px 0; border-top:1px solid var(--line); font-size:14px}
.news-item:first-child{border-top:0}
.news-item b{font-variant-numeric:tabular-nums; white-space:nowrap}
.src.more{flex-direction:row; flex-wrap:wrap; gap:4px 14px}
.sen-big{display:flex; align-items:baseline; gap:10px}
.sen-big .n{font-family:var(--display); font-weight:900; font-size:56px; line-height:1}
.sen-bar{position:relative}
.pacts{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:12px}
.pacts .panel{padding:14px; gap:6px}
.pacts h4{margin:0; font-size:15px}
ul.plain{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:8px}
.subnav{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:-8px}
.subtab{appearance:none; border:1px solid var(--line); background:var(--card); padding:6px 14px; border-radius:99px; font-size:13px; font-weight:600; cursor:pointer}
.subtab:hover{border-color:var(--ink)}
.subtab[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.gleg{display:inline-flex; align-items:center; gap:6px}
.gbar{display:inline-block; width:44px; height:10px; border-radius:2px}
.seat-legend{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--muted)}
.seat-rows{display:flex; flex-direction:column; gap:6px}
.seat-row{display:grid; grid-template-columns:150px minmax(0,1fr) 54px; gap:12px; align-items:center}
.seat-row.avg{padding-bottom:8px; border-bottom:1px solid var(--line); margin-bottom:4px}
.seat-row.out .seatbar{opacity:.55}
.sr-name{display:flex; flex-direction:column; line-height:1.2; min-width:0}
.sr-name b{font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sr-name span{font-size:11px; color:var(--muted)}
.sr-sum{display:flex; flex-direction:column; align-items:flex-end; line-height:1.1}
.sr-sum b{font-size:15px} .sr-sum span{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em}
.seatbar{position:relative; display:flex; height:22px; border-radius:4px; overflow:hidden; background:var(--soft)}
.seat-row.avg .seatbar{height:28px}
.seatbar i{display:flex; align-items:center; justify-content:center; height:100%; box-shadow:inset -2px 0 0 var(--card); font-style:normal; font-size:11px; font-weight:700; outline:none}
.seatbar i:last-of-type{box-shadow:none}
.seatbar i:hover,.seatbar i:focus{filter:brightness(1.12)}
.seatbar-maj{position:absolute; left:calc(50% - 1px); top:-3px; bottom:-3px; width:2px; background:var(--ink); pointer-events:none}
.pbars{display:flex; flex-direction:column; gap:0}
.pbar{display:grid; grid-template-columns:150px minmax(0,1fr); gap:12px; align-items:center}
.pb-name{font-size:13px; font-weight:600; display:flex; flex-direction:column; line-height:1.2; min-width:0; padding:3px 0}
.pb-name small{font-size:11px; font-weight:400; color:var(--muted)}
.pb-track{position:relative; height:100%; min-height:34px; display:flex; align-items:center}
.pb-head .pb-track{min-height:20px}
.pb-track i{position:relative; z-index:1; display:block; height:16px; background:var(--pc); border-radius:0 4px 4px 0; outline:none}
.pb-track i:hover,.pb-track i:focus{filter:brightness(1.12)}
.pbar.cis .pb-track i{opacity:.45}
.pb-track em{position:relative; z-index:3; font-style:normal; font-size:12px; font-weight:700; margin-left:4px; padding:0 3px; background:var(--card); border-radius:3px}
.ref{position:absolute; top:0; bottom:0; width:0; border-left:2px solid var(--ink); z-index:2; pointer-events:none}
.ref.r23{border-left:2px dashed var(--muted)}
.ref-lab{position:absolute; top:50%; margin-top:-8px; padding:0 5px; font-size:11px; font-weight:700; white-space:nowrap; color:var(--ink)}
.ref-lab.r23{color:var(--muted)}
.viz-tip{position:absolute; z-index:50; background:var(--ink); color:var(--paper); font-size:12px; line-height:1.35; padding:6px 9px; border-radius:6px; pointer-events:none; max-width:240px; box-shadow:0 2px 8px rgba(0,0,0,.18)}
.viz-tip span{opacity:.75}
@media (max-width:600px){ .seat-row{grid-template-columns:96px minmax(0,1fr) 44px; gap:8px} .pbar{grid-template-columns:96px minmax(0,1fr); gap:8px} .seatbar i span{display:none} }
.map-ctl{gap:10px; flex-wrap:wrap}
.map-ctl select{max-width:100%}
.map-grid{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:20px; align-items:start}
.map-wrap{width:100%}
.spain{width:100%; height:auto; display:block}
.spain .rg{stroke:var(--card); stroke-width:.7; cursor:pointer; transition:opacity .15s}
.spain .rg:hover{opacity:.82}
.spain .rg:focus{outline:none; stroke:var(--ink); stroke-width:2}
.spain .rg.sel{stroke:var(--ink); stroke-width:2.2}
.spain .frame{fill:none; stroke:var(--line); stroke-width:1}
.spain .maplbl{font-size:10px; fill:var(--muted); font-family:var(--body)}
.map-legend{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px}
.sq{display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:6px; vertical-align:-1px}
.schips{display:flex; flex-wrap:wrap; gap:6px 12px; font-size:13px}
.schip{display:inline-flex; align-items:center; gap:6px}
.seatstrip.big i{width:12px; height:12px}
table.mini td, table.mini th{padding:6px 8px}
.ally-blk{display:flex; flex-direction:column; gap:6px; border-top:1px solid var(--line); padding-top:10px}
.ally-blk.on .eyebrow{color:var(--ink)}
ul.ally{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:4px}
.ally-table th{text-align:left}
.sen-table td:first-child{white-space:normal}
.ally-table td{text-align:left; vertical-align:top; white-space:normal; min-width:160px}
.ally-table td div+div{margin-top:4px}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
@media (max-width:820px){ .map-grid{grid-template-columns:1fr} }
.pick-groups{display:flex; flex-direction:column; gap:10px}
.pick-group{display:flex; flex-direction:column; gap:6px}
.doc-head{display:flex; flex-direction:column; gap:8px}
.doc-meta{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding-top:4px}
.doc-meta > div{flex:1 1 240px; min-width:0}
.doc-link{text-decoration:none; font-size:13px; white-space:nowrap}
.cmp-row{display:flex; gap:8px; align-items:flex-start}
.cmp-row .flag{flex:none; margin-top:2px}
.src{font-size:13px; color:var(--muted); display:flex; flex-direction:column; gap:4px}
.terr{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); gap:12px}
.terr .panel{padding:14px; display:flex; flex-direction:column; gap:6px}
.terr h4{margin:0; display:flex; align-items:center; gap:8px; font-size:15px}

/* ---------- Comparar ---------- */
.cmp{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:12px}
.cmp .cell{border:1px solid var(--line); border-radius:var(--r); background:var(--card); padding:14px; display:flex; flex-direction:column; gap:6px; border-top:5px solid var(--pc)}
.cmp .cell h4{margin:0; font-size:14px; text-transform:uppercase; letter-spacing:.06em}
.cmp .cell.empty p{color:var(--muted); font-style:italic}
.quiz{display:flex; flex-direction:column; gap:12px}
.q{border:1px solid var(--line); border-radius:var(--r); padding:14px; background:var(--card); display:flex; flex-direction:column; gap:10px}
.q .qt{font-weight:600; font-size:16px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; flex-wrap:wrap}
.seg button{appearance:none; border:0; background:transparent; padding:7px 12px; font-size:13px; font-weight:600; cursor:pointer; border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.q details summary{cursor:pointer; font-size:13px; color:var(--muted)}

/* ---------- Encuestas ---------- */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr)); gap:10px}
.tile{border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; background:var(--card); border-left:6px solid var(--pc)}
.tile .n{font-family:var(--display); font-size:38px; font-weight:800; line-height:1}
.tile .d{font-size:12px; color:var(--muted)}
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--card)}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{padding:9px 10px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
thead th{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; position:sticky; top:0; background:var(--card)}
tbody tr:last-child td{border-bottom:0}
tr.cis td{color:var(--muted)}
td .lead-cell{font-weight:700}
.top1{font-weight:800}
.pollname b{display:block}
.pollname span{font-size:12px; color:var(--muted)}
.linkbtn{appearance:none; background:none; border:0; padding:0; text-decoration:underline; text-underline-offset:3px; cursor:pointer; font-weight:600; font-size:13px}
.chart{width:100%; height:auto; display:block}
.toggle{display:inline-flex; align-items:center; gap:8px; font-size:14px; cursor:pointer}
.toggle input{width:18px; height:18px; accent-color:var(--ink)}

/* ---------- Simulador ---------- */
.sim{display:grid; grid-template-columns:minmax(0,380px) minmax(0,1fr); gap:24px; align-items:start}
.sliders{display:flex; flex-direction:column; gap:10px}
.sl{display:grid; grid-template-columns:78px minmax(0,1fr) 58px; gap:10px; align-items:center}
.sl label{font-weight:600; font-size:14px; display:flex; align-items:center; gap:6px}
.sl input[type=range]{width:100%; accent-color:var(--pc)}
.sl output{text-align:right; font-weight:700; font-variant-numeric:tabular-nums; font-size:14px}
.sim select{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card)}
.sum-line{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); border-top:1px solid var(--line); padding-top:8px}
details.more summary{cursor:pointer; font-weight:600; font-size:14px; padding:6px 0}
.seat-table td:first-child{display:flex; align-items:center; gap:8px}
.delta.up{color:var(--good)} .delta.down{color:#C2410C}
.pact{display:flex; flex-direction:column; gap:12px}
.pact-bar{height:28px; border-radius:6px; background:var(--soft); position:relative; overflow:hidden; display:flex}
.pact-bar i{height:100%; display:block}
.pact-bar .maj{position:absolute; top:0; bottom:0; width:3px; background:var(--mark); left:50.29%; box-shadow:0 0 0 1px var(--ink)}
.pact-total{font-family:var(--display); font-size:44px; font-weight:800; line-height:1}
.prov-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr)); gap:8px}
.prov{appearance:none; text-align:left; border:1px solid var(--line); background:var(--card); border-radius:8px; padding:8px 10px; cursor:pointer; display:flex; flex-direction:column; gap:6px}
.prov:hover,.prov[aria-pressed="true"]{border-color:var(--ink)}
.prov .pn{display:flex; justify-content:space-between; font-weight:600; font-size:13px}
.seatstrip{display:flex; gap:2px; flex-wrap:wrap}
.seatstrip i{width:9px; height:9px; border-radius:2px; display:block}
.dh td.win{background:color-mix(in srgb,var(--mark) 55%,transparent); color:var(--ink); font-weight:700}
.dh td.next{outline:2px dashed var(--muted); outline-offset:-3px}
.dh td.out{color:var(--muted)}

/* ---------- Pregunta ---------- */
.chat{display:flex; flex-direction:column; gap:14px}
.msgs{display:flex; flex-direction:column; gap:12px; min-height:120px}
.msg{max-width:85ch; padding:12px 14px; border-radius:12px; line-height:1.6}
.msg.user{align-self:flex-end; background:var(--ink); color:var(--paper); border-bottom-right-radius:3px; max-width:75%}
.msg.bot{align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:3px}
.msg.bot p+p,.msg.bot p+ul,.msg.bot ul+p{margin-top:8px}
.msg.bot ul,.msg.bot ol{margin:6px 0; padding-left:20px}
.msg.bot h4{margin:8px 0 4px; font-size:15px}
.msg.err{border-color:var(--warn)}
.composer{display:flex; gap:8px; align-items:flex-end}
.composer textarea{flex:1; min-width:0; resize:vertical; min-height:52px; max-height:200px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card)}
.thinking{color:var(--muted); font-style:italic}
.sugg{display:flex; flex-wrap:wrap; gap:8px}

/* ---------- Calendario ---------- */
.cal{display:flex; flex-direction:column}
.cal-item{display:grid; grid-template-columns:96px minmax(0,1fr); gap:14px; padding:12px 0; border-bottom:1px solid var(--line); align-items:baseline}
.cal-item .cd{font-family:var(--display); font-size:24px; font-weight:800; line-height:1}
.cal-item .cd span{display:block; font-family:var(--body); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.cal-item.past{opacity:.55}
.cal-item.today{background:color-mix(in srgb,var(--mark) 22%,transparent)}
.kind{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-left:8px}
.faq{display:flex; flex-direction:column; gap:10px}
.faq details{border:1px solid var(--line); border-radius:var(--r); background:var(--card); padding:12px 14px}
.faq summary{cursor:pointer; font-weight:600}
.faq details p{margin-top:8px}
footer{max-width:1180px; margin:0 auto; padding-inline:16px; padding-block:24px 40px; border-top:1px solid var(--line); font-size:13px; color:var(--muted); display:flex; flex-direction:column; gap:6px}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .sim{grid-template-columns:1fr}
  .prog-block{grid-template-columns:1fr; gap:8px}
  .msg.user{max-width:90%}
}
@media (prefers-reduced-motion:no-preference){
  .bar .tr i,.meter i,.pact-bar i{transition:width .35s ease}
}

/* ---------- Voto por grupos ---------- */
.sgtable{display:flex; flex-direction:column}
.sgrow{display:grid; grid-template-columns:minmax(150px,210px) minmax(0,1fr); gap:14px; align-items:center; padding:9px 0; border-top:1px solid var(--line)}
.sgrow.sgtot{border-top:0}
.sgrow.sgtot + .sgrow{border-top:2px solid var(--ink)}
.gname{font-weight:600; font-size:14px; line-height:1.25; display:flex; flex-direction:column}
.gname small{font-weight:400; font-size:12px; color:var(--muted)}
.sgtot .gname{font-weight:800}
.sgbar{display:flex; height:26px; border-radius:4px; overflow:hidden; background:var(--soft)}
.sgbar i{display:flex; align-items:center; justify-content:center; min-width:0; font-style:normal; font-size:12px; font-weight:700; border-right:1px solid var(--card); outline-offset:-3px}
.sgbar i:last-child{border-right:0}
.sgbar i span{overflow:hidden; white-space:nowrap}
.sgbar i.sgrest,.sgrest-sq{background:var(--line); color:var(--muted)}
@media (max-width:600px){
  .sgrow{grid-template-columns:1fr; gap:5px; padding:8px 0}
  .sgbar{height:22px}
  .sgbar i{font-size:11px}
}

/* ---------- Partidos minoritarios ---------- */
.mrows{display:flex; flex-direction:column}
.mrow{display:grid; grid-template-columns:150px minmax(0,1fr) 64px; gap:14px; align-items:center; padding:6px 0; border-top:1px solid var(--line)}
.mrow.mhead{border-top:0; padding:0}
.mname{display:flex; gap:8px; align-items:center; min-width:0}
.mname > span{display:flex; flex-direction:column; line-height:1.2; min-width:0}
.mname b{font-size:14px} .mname small{font-size:11px; color:var(--muted)}
.mtrack{position:relative; height:40px}
.mhead .mtrack{height:16px}
.mhead em{position:absolute; transform:translateX(-50%); font-style:normal; font-size:11px; color:var(--muted)}
.mgrid{position:absolute; top:0; bottom:0; width:1px; background:var(--line)}
.mrange{position:absolute; top:50%; height:12px; margin-top:-6px; background:var(--pc); opacity:.18; border-radius:6px}
.mtrack .mdot{position:absolute; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%; background:var(--card); border:2px solid var(--pc); z-index:2; outline-offset:2px}
.mtrack .mdia{position:absolute; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; transform:rotate(45deg); background:var(--pc); border:2px solid var(--card); box-shadow:0 0 0 1px var(--ink); z-index:3}
.mtrack .m23{position:absolute; top:6px; bottom:6px; width:0; border-left:2px dashed var(--muted); z-index:1}
.seat-legend .mdot,.seat-legend .mdia,.seat-legend .m23{display:inline-block; vertical-align:-1px; margin-right:6px}
.seat-legend .mdot{width:9px; height:9px; border-radius:50%; border:2px solid var(--ink)}
.seat-legend .mdia{width:9px; height:9px; transform:rotate(45deg); background:var(--ink)}
.seat-legend .m23{width:0; height:11px; border-left:2px dashed var(--muted)}
.msum{display:flex; flex-direction:column; align-items:flex-end; line-height:1.1}
.msum b{font-family:var(--display); font-size:24px; font-weight:800} .msum small{font-size:11px; color:var(--muted)}
.mcards{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:12px}
.mcard{display:flex; flex-direction:column; gap:8px; padding:14px; border-top:5px solid var(--pc)}
.mcard h4{margin:0; font-size:15px}
.mbig{font-family:var(--display); font-size:34px; font-weight:800; line-height:1; display:flex; flex-direction:column; align-items:flex-end}
.mbig small{font-family:var(--body); font-size:11px; font-weight:600; color:var(--muted)}
.mfacts{display:flex; gap:4px 16px; flex-wrap:wrap}
.mloc{background:var(--soft); padding:8px 10px; border-radius:8px}
@media (max-width:600px){ .mrow{grid-template-columns:84px minmax(0,1fr) 40px; gap:8px} .mname .dot{display:none} .msum b{font-size:20px} }

/* ---------- Escaños en el aire y probabilidades ---------- */
.air-list{display:flex; flex-direction:column}
.air-row{appearance:none; background:none; border:0; border-top:1px solid var(--line); width:100%; text-align:left; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 70px; gap:10px; align-items:center; padding:8px 4px; font-size:14px; cursor:pointer; color:inherit}
.air-row:hover{background:var(--soft)}
.air-head{cursor:default; border-top:0; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding-block:0 6px}
.air-head:hover{background:none}
.air-pair{display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; min-width:0}
.air-p{display:inline-flex; align-items:center; gap:5px; white-space:nowrap; font-weight:600}
.air-need{text-align:right; font-weight:700}
.air-need.hot{color:var(--warn)}
.prob-hist{position:relative; padding-bottom:20px}
.prob-hist svg{display:block; width:100%; height:140px}
.prob-hist .maj176{position:absolute; top:0; bottom:20px; width:0; border-left:2px dashed var(--ink)}
.prob-hist .maj176 b{position:absolute; top:-2px; left:5px; font-size:12px}
.hist-axis{position:absolute; left:0; right:0; bottom:0; height:18px}
.hist-axis span{position:absolute; transform:translateX(-50%); font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
@media (max-width:600px){ .air-row{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) 58px; gap:6px; font-size:13px} }
.prob-table td:first-child{white-space:normal}
@media (max-width:600px){ .prob-table th,.prob-table td{padding:8px 6px} }

/* ---------- Candidatos ---------- */
.cand-ctl{display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end}
.cand-ctl select,.cand-ctl input{padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); width:100%; min-width:0}
.cand-ctl label{min-width:0}
.cand-hits{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr)); gap:6px}
.cand-hit{appearance:none; text-align:left; display:flex; gap:8px; align-items:flex-start; border:1px solid var(--line); background:var(--card); border-radius:8px; padding:8px 10px; cursor:pointer; color:inherit}
.cand-hit:hover{border-color:var(--ink)}
.cand-hit .dot{margin-top:6px}
.cand-hit > span{display:flex; flex-direction:column; min-width:0}
.cgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr)); gap:10px; align-items:start}
.ccard{border:1px solid var(--line); border-top:5px solid var(--pc); border-radius:var(--r); background:var(--card); padding:12px 14px; display:flex; flex-direction:column; gap:8px; min-width:0}
.cc-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 8px; line-height:1.25}
.cc-head b{font-size:14px}
.cc-seats{margin-left:auto; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:2px 8px; border-radius:99px; background:var(--soft); color:var(--muted); white-space:nowrap}
.cc-seats.on{background:var(--mark); color:var(--mark-ink)}
.cc-list{margin:0; padding-left:22px; display:flex; flex-direction:column; gap:3px; font-size:13px}
.cc-list li.in::marker{font-weight:700}
.cc-list li.in{background:color-mix(in srgb,var(--mark) 38%,transparent); border-radius:4px; padding:0 4px; margin-left:-4px}
.ccard:not(.open) .cc-list li.more{display:none}
.ctag{font-size:11px; color:var(--muted); font-weight:500}
.cc-circ{margin:0; font-size:16px}

/* ---------- Papeleta del Senado ---------- */
.pap-grid{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:20px; align-items:start}
@media (max-width:820px){ .pap-grid{grid-template-columns:1fr} }
.sen-ballot{background:#EFDDB8; color:#2B2416; border:1px solid #C9AE7C; border-radius:4px; padding:16px 18px 18px; display:flex; flex-direction:column; gap:12px; box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sb-head{display:flex; flex-direction:column; gap:2px; text-align:center; border-bottom:2px solid #2B2416; padding-bottom:10px}
.sb-head b{font-family:var(--display); font-size:24px; text-transform:uppercase; letter-spacing:.04em}
.sb-head span{font-size:12px}
.sb-rule{margin-top:4px; font-size:13px !important}
.sb-list{border:0; border-top:1px solid #B79B66; margin:0; padding:8px 0 0; display:flex; flex-direction:column; gap:2px; min-width:0}
.sb-list legend{font-size:11px; font-weight:700; letter-spacing:.03em; padding:0 6px 0 0; text-transform:uppercase; max-width:100%}
.sb-cand{display:flex; align-items:center; gap:10px; padding:4px 2px; cursor:pointer; font-size:14px; border-radius:4px}
.sb-cand:hover{background:rgba(43,36,22,.07)}
.sb-cand input{position:absolute; opacity:0; width:1px; height:1px}
.sb-box{flex:none; width:20px; height:20px; border:2px solid #2B2416; border-radius:2px; position:relative; background:#F7ECD3}
.sb-cand input:checked + .sb-box::before,.sb-cand input:checked + .sb-box::after{content:""; position:absolute; left:50%; top:50%; width:22px; height:3px; background:#1B3E8A; border-radius:2px}
.sb-cand input:checked + .sb-box::before{transform:translate(-50%,-50%) rotate(45deg)}
.sb-cand input:checked + .sb-box::after{transform:translate(-50%,-50%) rotate(-45deg)}
.sb-cand input:focus-visible + .sb-box{outline:3px solid var(--mark); outline-offset:2px}
.sen-ballot .ctag{color:#6B5A3A}
.pap-status{border-radius:var(--r); padding:12px 14px; border:1px solid var(--line); background:var(--card)}
.pap-status.ok{border-color:var(--good); background:color-mix(in srgb,var(--good) 10%,var(--card))}
.pap-status.bad{border-color:#C2410C; background:color-mix(in srgb,#C2410C 10%,var(--card))}
.pap-status.blank{background:var(--soft)}
#pap-side .bar{grid-template-columns:minmax(0,150px) minmax(0,1fr) 54px}
.cc-list li.in .muted{color:inherit; opacity:.8}
.cc-list li.in{color:var(--ink)}

</style>
</head>

/* Vox no se presentó en S. C. de Tenerife en 2023: se usa como base su 9,8% en el Senado de esa provincia. */
const VOX_SCT_BASE = 9.8;

/* Geografía de partidos sin base en 2023 (índices relativos, media ≈ 1 en su ámbito) */
const AA_IDX = {"Cádiz":1.5,"Sevilla":1.25,"Málaga":0.95,"Granada":0.85,"Córdoba":0.9,"Huelva":0.85,"Jaén":0.7,"Almería":0.55}; // Adelante Andalucía
const AND_SHARE = 0.1775;   // peso de Andalucía en el voto válido nacional (2023)

function baseShares(p, opts){
  const [name,, , , pp, psoe, vox, sumar, extra] = p;
  const voxB = (name==="S. C. de Tenerife" && !(opts&&opts.vox2023)) ? VOX_SCT_BASE : vox;
  return {pp, psoe, vox: voxB, sumar, extra};
}

/* targets: {PP:%, PSOE:%, VOX:%, FA:%, POD:%, SALF:%, ERC:%, ...} (% nacional de voto válido)
   opts.seatKey: 2 = escaños 2026 (por defecto), 3 = escaños 2023; opts.vox2023: usa Vox 0 en SCT (para validar); opts.pacts2023: sin las alianzas de 2026 */
function simulate(targets, opts){
  opts = opts || {};
  const seatIdx = opts.seatKey || 2;
  const T = {}; MODEL_PARTIES.forEach(k => T[k] = Math.max(0, +targets[k] || 0));
  const sumT = MODEL_PARTIES.reduce((a,k)=>a+T[k],0);
  const othersNat = Math.max(0.5, 100 - sumT);
  const totals = {}; MODEL_PARTIES.forEach(k=>totals[k]=0);
  const provinces = PROVINCES.map(p => {
    const name = p[0], seats = p[seatIdx];
    const b = baseShares(p, opts);
    const raw = {};
    raw.PP = b.pp * T.PP / NAT2023.PP;
    raw.PSOE = b.psoe * T.PSOE / NAT2023.PSOE;
    raw.VOX = b.vox * T.VOX / NAT2023.VOX;
    const cfvOwn = T.CFV > 0 && !opts.pacts2023;
    raw.FA = b.sumar * T.FA / (cfvOwn ? NAT2023.SUMAR - SUMAR_CV_NAT : NAT2023.SUMAR);
    raw.POD = b.sumar * T.POD / NAT2023.SUMAR;
    raw.SALF = T.SALF * (0.5 + 0.5 * (b.vox / NAT2023.VOX));
    ["ERC","JUNTS","BILDU","PNV","BNG","CC","UPN"].forEach(k => { raw[k] = (b.extra[k]||0) * T[k] / NAT2023[k]; });
    raw.AA = AA_IDX[name] ? T.AA / AND_SHARE * AA_IDX[name] : 0;
    raw.CFV = 0; raw.UPC = 0;
    if (opts.jitter) MODEL_PARTIES.forEach(k => { if (raw[k] > 0) raw[k] *= opts.jitter(name, k); }); // ruido provincial (solo en la simulación de probabilidades)
    const pieces = {FA: raw.FA, POD: raw.POD}; // antes de fusionar, para el Senado
    if (!opts.pacts2023) {
      if (CFV_PROV.includes(name)) { raw.CFV = (cfvOwn ? b.sumar * T.CFV / SUMAR_CV_NAT : raw.FA) + raw.POD; raw.FA = 0; raw.POD = 0; }
      else if (UPC_PROV.includes(name)) { raw.UPC = raw.FA + raw.POD; raw.FA = 0; raw.POD = 0; }
      else if (p[1] === "Cataluña") { raw.ERC += raw.POD/2; raw.FA += raw.POD/2; raw.POD = 0; }
      else if (POD_IN_FA.includes(name)) { raw.FA += raw.POD; raw.POD = 0; }
      if (FA_OUT.includes(name)) raw.FA = 0;
      if (POD_OUT.includes(name)) raw.POD = 0;
    }
    const listed2023 = b.pp + b.psoe + (opts.vox2023 ? p[6] : b.vox) + b.sumar + Object.values(b.extra).reduce((a,v)=>a+v,0);
    const others2023 = Math.max(0.5, 100 - listed2023);
    const othersI = Math.min(40, others2023 * othersNat / OTHERS2023_NAT);
    const sumRaw = MODEL_PARTIES.reduce((a,k)=>a+raw[k],0);
    const scale = sumRaw > 0 ? (100 - othersI) / sumRaw : 0;
    const share = {}; MODEL_PARTIES.forEach(k => share[k] = raw[k]*scale);
    const parts = {FA: pieces.FA*scale, POD: pieces.POD*scale};
    let labels = null, upnpp = null;
    if (name === "Navarra" && !opts.pacts2023) { upnpp = {PP: share.PP, UPN: share.UPN}; share.UPN += share.PP; share.PP = 0; labels = {UPN:"UPN-PP"}; }
    const alloc = dhondt(share, seats, 3);
    if (upnpp && alloc.seats.UPN) { /* orden de la lista: UPN, PP, PP, UPN, PP */ const ord = ["UPN","PP","PP","UPN","PP"]; const n = alloc.seats.UPN; alloc.seats.UPN = 0; for (let i=0;i<n;i++){ const k = ord[i]||"PP"; alloc.seats[k] = (alloc.seats[k]||0) + 1; } if (!alloc.seats.UPN) delete alloc.seats.UPN; }
    MODEL_PARTIES.forEach(k => totals[k] += alloc.seats[k]||0);
    return {name, ccaa:p[1], seats, share, alloc, others: othersI, parts, labels, upnpp};
  });
  return {totals, provinces};
}

/* ===== Senado: 209 senadores electos en 60 circunscripciones (Formentera elige uno propio desde 2026) =====
   Proyección orientativa: el voto de cada provincia (modelo del Congreso) se agrupa en las listas al Senado de 2026
   y se aplica el patrón habitual del voto limitado: en las de 4 escaños, la lista más votada gana 3 y la segunda 1
   (2 y 2 si las separa menos de 1 punto); en las de 3, 2 y 1; en las de 2, 2 y 0 si la ventaja supera 3 puntos (si no, 1 y 1). */
const SEN_ISLANDS = {
  "Baleares": [["Mallorca",3],["Menorca",1],["Ibiza",1],["Formentera",1]],
  "Las Palmas": [["Gran Canaria",3],["Lanzarote",1],["Fuerteventura",1]],
  "S. C. de Tenerife": [["Tenerife",3],["La Palma",1],["La Gomera",1],["El Hierro",1]]
};
const SEN_CIRCS = []; // [circunscripción, provincia, ccaa, escaños]
PROVINCES.forEach(p => {
  if (SEN_ISLANDS[p[0]]) SEN_ISLANDS[p[0]].forEach(([n,s]) => SEN_CIRCS.push([n, p[0], p[1], s]));
  else SEN_CIRCS.push([p[0], p[0], p[1], (p[0]==="Ceuta"||p[0]==="Melilla") ? 2 : 4]);
});
const SEN_LOCAL = {"La Gomera":"ASG", "El Hierro":"AHI"}; // partidos insulares que no recoge el modelo: se mantiene su resultado de 2023
const SDP_PSOE3 = ["Álava","Sevilla"];                   // el PSOE pone los 3 candidatos de Senado de Progreso
/* Acuerdo PP–Vox para el Senado (26 oct. 2026), por provincia:
   - SEN_VOX_OUT: Vox no presenta lista y el PP lleva a un independiente propuesto por Vox → se suma el voto de los dos en la lista del PP.
   - SEN_VOX_ONE: Vox presenta un solo candidato → sus votantes marcan a ese candidato y a dos del PP. Se calcula candidato a candidato:
     los dos primeros del PP reciben el voto de PP + Vox; el tercero, solo el del PP; el de Vox, el de Vox.
   - SEN_PP_OUT: el PP no se presenta → quitamos su lista y no trasladamos su voto (no hay dato de adónde iría). */
const SEN_VOX_OUT = ["Cádiz","Valencia","Castellón","Baleares","Las Palmas","S. C. de Tenerife"];
const SEN_VOX_ONE = ["Sevilla","Huelva","Asturias","Badajoz","Álava","Bizkaia","Cáceres","Huesca","Zaragoza","Alicante","Granada","Cuenca","Pontevedra","Jaén"]; // según el BOE del 28 oct.
const COMUNS_SEN_OUT = ["Girona","Lleida","Tarragona"]; // los Comuns retiran su lista al Senado y apoyan al PSC (27 oct.)
const SEN_PP_OUT = ["Gipuzkoa","Girona","Tarragona"];
function senateLists(pr, circ, y2023){
  const s = pr.share, c = pr.ccaa, L = {}, add = (k,v) => { if (v > 0.05) L[k] = (L[k]||0) + v; };
  ["PP","VOX","SALF","AA","JUNTS","PNV","BNG"].forEach(k => add(k, s[k]||0));
  if (y2023) { add("PSOE", s.PSOE); add("FA", s.FA); ["ERC","BILDU","UPN","CC"].forEach(k=>add(k, s[k]||0)); if (circ==="Ibiza") { L.SDP = (L.PSOE||0) + (L.FA||0); delete L.PSOE; delete L.FA; } return L; }
  if (c === "Cataluña") { if (COMUNS_SEN_OUT.includes(pr.name)) add("PSOE", s.PSOE + s.FA); else { add("PSOE", s.PSOE); add("FA", s.FA); } add("ERC", s.ERC); }
  else if (c === "Canarias") { add("PSOE", s.PSOE); add("UPC", s.UPC); if (circ !== "El Hierro") add("CC", s.CC); }
  else if (c === "Baleares") { add("SDP", s.PSOE + s.FA + (circ==="Ibiza" ? s.POD : 0)); if (circ !== "Ibiza") add("POD", s.POD); }
  else {
    const val = CFV_PROV.includes(pr.name);
    add("SDP", s.PSOE + (val ? pr.parts.FA : s.FA));
    if (!val) add("POD", s.POD); // en la C. Valenciana Podemos no se presenta al Senado
    add("BILDU", s.BILDU);
    if (pr.name === "Navarra") { L.UPNPP = pr.upnpp ? pr.upnpp.PP + pr.upnpp.UPN : (L.PP||0) + (s.UPN||0); delete L.PP; }
  }
  if (SEN_VOX_OUT.includes(pr.name) && L.VOX) { L.PP = (L.PP||0) + L.VOX; delete L.VOX; }
  if (SEN_PP_OUT.includes(pr.name)) delete L.PP;
  return L;
}
/* Reparto de los escaños de una lista entre partidos (orden de candidatos publicado) */
function senateSeatsOf(list, n, circ, prov, ccaa){
  const o = {};
  if (list === "SDP") {
    if (ccaa === "Baleares" || n < 2 || SDP_PSOE3.includes(circ)) o.PSOE = n;
    else { o.PSOE = n - 1; o[CFV_PROV.includes(prov) ? "CFV" : "FA"] = 1; }
  } else if (list === "UPNPP") { if (n >= 2) { o.UPN = n - 1; o.PP = 1; } else o.UPN = n; }
  else o[list] = n;
  return o;
}
function senateProjection(res, opts){
  opts = opts || {};
  const y2023 = !!opts.y2023;
  const circs = y2023 ? SEN_CIRCS.filter(c=>c[0]!=="Formentera").map(c => c[0]==="Ibiza" ? ["Ibiza","Baleares","Baleares",1] : c) : SEN_CIRCS;
  const totals = {}, out = [];
  circs.forEach(([name, prov, ccaa, seats]) => {
    const pr = res.provinces.find(p => p.name === prov);
    const lists = senateLists(pr, name, y2023);
    const ord = Object.keys(lists).sort((a,b) => lists[b] - lists[a]);
    const [a, b] = ord;
    let gap = lists[a] - (lists[b]||0);
    const win = {};
    const rk = lists.UPNPP != null ? "UPNPP" : "PP";
    if (!y2023 && seats === 4 && SEN_VOX_ONE.includes(prov) && lists.VOX && lists[rk] != null) {
      /* Vox con un solo candidato: reparto candidato a candidato */
      const cands = [];
      Object.entries(lists).forEach(([l,v]) => {
        if (l === "VOX") cands.push([l, v]);
        else if (l === rk) cands.push([l, v + lists.VOX], [l, v + lists.VOX], [l, v]);
        else for (let i=0;i<3;i++) cands.push([l, v]);
      });
      cands.sort((x,y) => y[1] - x[1]);
      cands.slice(0, 4).forEach(([l]) => win[l] = (win[l]||0) + 1);
      const nextOther = cands.slice(4).find(x => x[0] !== cands[3][0]); // un empate dentro de la misma lista no cambia el reparto
      gap = cands[3][1] - (nextOther ? nextOther[1] : 0);
    }
    else if (seats === 4) { if (gap < 1) { win[a] = 2; win[b] = 2; } else { win[a] = 3; win[b] = 1; } }
    else if (seats === 3) { win[a] = 2; win[b] = 1; }
    else if (seats === 2) { if (gap > 3) win[a] = 2; else { win[a] = 1; win[b] = 1; } }
    else win[a] = 1;
    let alloc = {}, local = false;
    if (SEN_LOCAL[name]) { alloc = {[SEN_LOCAL[name]]: 1}; local = true; }
    else Object.entries(win).forEach(([l,n]) => Object.entries(senateSeatsOf(l, n, name, prov, ccaa)).forEach(([k,v]) => alloc[k] = (alloc[k]||0) + v));
    Object.entries(alloc).forEach(([k,v]) => totals[k] = (totals[k]||0) + v);
    out.push({name, prov, ccaa, seats, lists, order: ord, alloc, win, local, close: seats > 1 && gap < 2 && !local});
  });
  return {totals, circs: out};
}

/* ===== Probabilidades: muchas elecciones simuladas alrededor de un escenario =====
   En cada simulación, el voto nacional de cada partido se mueve con un error normal (sd, en puntos; los territoriales, en proporción)
   y, además, cada partido se mueve en cada provincia con un ruido del PROV_SD (relativo). Semilla fija: mismo resultado en cada visita. */
const PROV_SD = 0.06;
const BLOC_W = {PP:0.6, VOX:0.4, PSOE:-0.6, FA:-0.25, POD:-0.15};
function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gauss(r){ let u = 0, v = 0; while (u === 0) u = r(); v = r(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }
function monteCarlo(base, sd, n, seed){
  const r = rng(seed || 29112026), runs = [];
  for (let i = 0; i < n; i++) {
    const t = {}, z = gauss(r) * (sd.__bloc || 0); // error común: lo que gana la derecha lo pierde la izquierda
    Object.keys(base).forEach(k => { const b = +base[k] || 0; if (b <= 0) { t[k] = 0; return; } t[k] = Math.max(0, b + gauss(r) * (sd[k] != null ? sd[k] : b * 0.12) + z * (BLOC_W[k] || 0)); });
    const res = simulate(t, {jitter: () => Math.exp(gauss(r) * PROV_SD)});
    runs.push(res.totals);
  }
  return runs;
}

/* D'Hondt con barrera (% del voto válido de la circunscripción) */
function dhondt(share, seats, barrier){
  const eligible = Object.keys(share).filter(k => share[k] >= barrier);
  const quotients = [];
  eligible.forEach(k => { for (let d=1; d<=seats; d++) quotients.push({party:k, d, q: share[k]/d}); });
  quotients.sort((a,b)=> b.q - a.q);
  const won = quotients.slice(0, seats);
  const res = {}; won.forEach(x => res[x.party] = (res[x.party]||0)+1);
  const last = won[won.length-1] || null;
  const next = quotients[seats] || null;
  return {seats:res, eligible, last, next, quotients: quotients.slice(0, seats + 4)};
}

        {topic:"Gobierno en precampaña", items:["Decreto de 45,3 millones para Ceuta, ligado a la atención a menores migrantes.","Anuncio de 500 plazas de jueces y 200 de fiscales para 2027.","Negociación de una nueva subida del salario mínimo (Yolanda Díaz) y posible revalorización de las pensiones aunque el Gobierno esté en funciones."]},
        {topic:"Candidatura y programa", items:["El Comité Federal proclamó a Sánchez candidato por unanimidad el 17 de octubre; las mujeres encabezan el 52% de las listas al Congreso.","Montse Mínguez dimitió como portavoz el 16 de octubre por los negocios inmobiliarios de su pareja; la sustituye Rebeca Torró.","Marc Pons redactará las propuestas de transición ecológica del programa."]}
      ]},
      {kind:"2026", label:"Precampaña 2026", title:"Decretos y anuncios del Gobierno", date:"sep. – oct. 2026", url:"https://www.idealista.com/news/finanzas/economia/2026/09/29/916383-el-gobierno-acuerda-proteger-los-desahucios-hasta-2030-y-prohibir-la-compra-por-fondos", sections:[

          "Suspensión de desahucios de personas vulnerables sin alternativa habitacional hasta 2030.",

          "Regular el alquiler de temporada y por habitaciones; IVA del 10% para pisos turísticos y del 4% para vivienda protegida.",

          "Bonificaciones fiscales para inquilinos con rentas de hasta 33.000 €."]},
        {topic:"Defensa", items:["Rechaza el objetivo del 5% del PIB en defensa que pide la OTAN."]},
        {topic:"Inmigración", items:["Regularización extraordinaria de inmigrantes aprobada por el Gobierno en 2026."]},
        {topic:"Empleo (votación)", items:["Impulsó con Sumar la jornada de 37,5 horas, rechazada por el Congreso en septiembre de 2025."]}

      {kind:"doc", label:"41.º Congreso 2024", title:"Ponencia marco del 41.º Congreso Federal", date:"nov. 2024", url:"https://www.elindependiente.com/espana/2024/11/11/federalizar-la-agencia-tributaria-derecho-al-voto-para-los-mayores-de-16-anos-fiscalidad-verde-las-claves-de-la-ponencia-del-41o-congreso-del-psoe/", sections:[
        {topic:"Financiación y Estado", items:["Reforma de la financiación con más recursos para todas las comunidades y reducir a la mitad la diferencia por habitante.","Evitar la competencia fiscal a la baja en Patrimonio, Sucesiones y el IRPF alto.","Federalizar la dirección de la Agencia Tributaria y aliviar la deuda autonómica.","Reformar el Senado como cámara territorial."]},
        {topic:"Constitución y derechos", items:["Llevar a la Constitución el aborto, el matrimonio igualitario, la subida del salario mínimo, la sanidad universal, el derecho al agua y la titularidad pública permanente de la vivienda protegida.","Voto a los 16 años y un «escaño ciudadano» en Congreso y Senado."]},
        {topic:"Empleo e impuestos", items:["Jornada media de no más de 36 horas semanales en 2030.","Obligar a las empresas de más de 250 empleados a repartir parte de sus beneficios con la plantilla.","Reforma fiscal con más ingresos, menos fraude y más progresividad; fiscalidad ambiental con un bono climático."]},
        {topic:"Vivienda", items:["Parque público de al menos el 6% de las viviendas.","Rehabilitar 1,5 millones de viviendas antes de 2030.","Acabar con los pisos turísticos ilegales."]},
        {topic:"Inmigración", items:["Canales de migración segura y ordenada y homologación ágil de títulos."]},
        {topic:"Clima, agua y movilidad", items:["80% de electricidad renovable y 5% menos de consumo de agua en 2030.","Banco público de agua y nuevas desaladoras.","80.000 puntos de recarga en 2030, billete único de transporte y que las grandes empresas paguen el 50% del transporte público de su plantilla."]},
        {topic:"Igualdad", items:["Delito de terapias de conversión.","Ley abolicionista de la prostitución."]},
        {topic:"Exterior", items:["Más integración europea en exterior y defensa.","Solución de dos Estados en Israel y Palestina y apoyo a Ucrania."]}
      ]},
      {kind:"2023", label:"Programa 23-J", title:"Programa electoral 2023 (presentación)", date:"7 jul. 2023", url:"https://www.elindependiente.com/wp-content/uploads/2023/07/PresentacionProgramaElectoral_PS_7jul2023-1.pdf", sections:[
        {topic:"Empleo", items:["Pleno empleo con una tasa de paro del 8%, mediante un acuerdo social.","Que el salario mínimo nunca baje del 60% del salario medio, por ley."]},
        {topic:"Vivienda", items:["183.000 viviendas públicas de alquiler, la mitad para jóvenes.","Ampliar el Bono de Alquiler Joven.","Cuenta de ahorro para la primera vivienda con hasta 30.000 € libres de impuestos."]},
        {topic:"Pensiones", items:["Revalorizar las pensiones con el IPC por ley.","5.000 millones al año al fondo de reserva."]},
        {topic:"Sanidad", items:["Incluir dentista, fisioterapia, oftalmología, psiquiatría y psicología clínica en la sanidad pública.","Plazos máximos por ley: 30 días para pruebas y 15 días para atención psicológica a jóvenes."]},
        {topic:"Educación y juventud", items:["250.000 nuevas plazas de FP.","Universidad y FP superior gratis para quien apruebe a la primera.","Transporte urbano gratis para niños y estudiantes hasta 24 años."]},
        {topic:"Igualdad", items:["Permisos de nacimiento de 16 a 20 semanas.","Ley de Paridad y red pública de cuidados."]},
        {topic:"Instituciones", items:["Debates electorales obligatorios y fin de los aforamientos no ligados al cargo.","Renovar el CGPJ con el sistema actual.","Nueva financiación autonómica en un año, con gasto mínimo del 7% del PIB en sanidad, 5% en educación y 2% en servicios sociales."]},
        {topic:"Clima y agua", items:["Que los vecinos participen en la ubicación de renovables y reciban el 10% de los beneficios.","Duplicar la desalación y blindar la gestión pública del agua urbana."]}
      ]}

        {topic:"Economía", items:["Desregulación: quitar trabas y leyes que encarecen la construcción de vivienda y la actividad de empresas, agricultores y autónomos.","Bajar la presión fiscal y recortar el «gasto ideológico».","IRPF de dos tramos."]},

      {kind:"2026", label:"Precampaña 2026", title:"Propuestas y condiciones de 2026", date:"jun. – oct. 2026", url:"https://es.euronews.com/2026/10/05/vox-pp-condiciones-gobernar-espana-remigracion-desregularizacion-prioridad-nacional", sections:[

        {topic:"Empleo", items:["Bonificar el 100% de las cotizaciones el primer año y el 50% el segundo en contratos indefinidos.","Derogar la reforma laboral.","Sin cuota de autónomos para quien ingrese menos del salario mínimo."]},

        {topic:"Inmigración", items:["Inmigración legal adaptada al mercado laboral.","Repatriar a los menores extranjeros a sus países.","Sanidad para inmigrantes irregulares solo en urgencias; impedir su empadronamiento.","Despliegue militar en Ceuta, Melilla y Canarias."]},
        {topic:"Modelo territorial", items:["Estado unitario descentralizado administrativamente.","Suspender la autonomía de comunidades que atenten contra la unidad de España.","Integrar las policías autonómicas en las nacionales."]},
        {topic:"Instituciones y justicia", items:["Suprimir las subvenciones a partidos, sindicatos y patronales.","Cerrar las televisiones autonómicas y el Ministerio de Igualdad; menos ministerios y diputados.","Recuperar los delitos de referéndum ilegal y sedición."]},
        {topic:"Familia", items:["Derogar la Ley contra la Violencia de Género y sustituirla por una de violencia intrafamiliar.","Prohibir tratamientos de cambio de sexo en menores.","Deducción por nacimiento de 1.200 a 2.750 € según el número de hijo."]},

        {topic:"Defensa y exterior", items:["Presión internacional para recuperar Gibraltar.","Incluir Ceuta y Melilla expresamente en la OTAN.","Servicio militar de reserva voluntario y más inversión en defensa."]}

/* ---------- Encuestas: media ---------- */
let includeCIS = false;
function latestPerFirm(withCIS){
  const seen = new Set(), out = [];
  POLLS.filter(p => p.d >= "2026-09-01" && !p.out && (withCIS || !p.cis))
       .sort((a,b)=> b.d.localeCompare(a.d))
       .forEach(p => { if(!seen.has(p.firm)){ seen.add(p.firm); out.push(p); } });
  return out;
}
function average(withCIS){
  const set = latestPerFirm(withCIS), avg = {};
  MAIN6.concat(MINORS).forEach(k => {
    const vals = set.map(p=> k==="FA" && p.FA!=null ? p.FA + (p.CFV||0) : p[k]).filter(v => v!=null); // FA incluye Compromís si la encuesta lo da aparte
    avg[k] = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : MINOR_DEFAULTS[k];
    if (MINORS.includes(k) && vals.length < 3) avg[k] = MINOR_DEFAULTS[k];
  });
  return {avg, n:set.length, set};
}
function pollTargets(p){
  const avg = average(false).avg, t = {};
  MAIN6.forEach(k => t[k] = p[k]!=null ? p[k] : avg[k]);
  MINORS.forEach(k => t[k] = p[k]!=null ? p[k] : MINOR_DEFAULTS[k]);
  if (p.CFV) t.CFV = p.CFV;
  return t;
}

/* ---------- Hemiciclo (SVG) ---------- */
function hemicycle(totals, opts={}){
  const W = 640, H = 340, cx = W/2, cy = H - 14, R = 300, r0 = 120, rows = 11, total = 350;
  const radii = Array.from({length:rows}, (_,i)=> r0 + (R - r0) * i/(rows-1));
  const sumR = radii.reduce((a,b)=>a+b,0);
  let counts = radii.map(r => Math.round(total * r / sumR));
  let diff = total - counts.reduce((a,b)=>a+b,0); counts[rows-1] += diff;
  const pts = [];
  radii.forEach((r,i) => { const k = counts[i]; for(let j=0;j<k;j++){ const a = Math.PI - (k===1?Math.PI/2: j*Math.PI/(k-1)); pts.push({a, x: cx + r*Math.cos(a), y: cy - r*Math.sin(a)}); } });
  pts.sort((p,q)=> q.a - p.a);
  const seq = []; SEAT_ORDER.forEach(k => { for(let i=0;i<(totals[k]||0);i++) seq.push(k); });
  while (seq.length < total) seq.push("_");
  const dotR = (R - r0)/(rows-1) * 0.42;
  let svg = `<svg class="hemi" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||"Reparto de 350 escaños")}">`;
  pts.forEach((p,i) => { const k = seq[i]; svg += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${dotR.toFixed(1)}" ${k==="_"?'style="fill:var(--soft)"':'fill="'+color(k)+'"'}><title>${esc(k==="_"?"Sin asignar":sname(k))}</title></circle>`; });
  const maj = Object.values(totals).reduce((a,b)=>a+b,0);
  svg += `<text x="${cx}" y="${cy-62}" text-anchor="middle" font-weight="800" font-size="54" style="fill:var(--ink);font-family:var(--display)">${opts.center!=null?opts.center:350}</text>`;
  svg += `<text x="${cx}" y="${cy-36}" text-anchor="middle" font-size="13" style="fill:var(--muted);font-family:var(--body)">${esc(opts.sub||"escaños · mayoría 176")}</text>`;
  const ty = cy - R - dotR; svg += `<line x1="${cx}" y1="${(ty-14).toFixed(1)}" x2="${cx}" y2="${(ty-3).toFixed(1)}" stroke-width="2" style="stroke:var(--ink)"/><text x="${cx+6}" y="${(ty-4).toFixed(1)}" font-size="11" style="fill:var(--muted);font-family:var(--body)">176</text>`;
  return svg + "</svg>";
}
function legend(totals){
  return `<div class="hemi-legend">` + SEAT_ORDER.slice().sort((a,b)=>(totals[b]||0)-(totals[a]||0)).filter(k=>totals[k]>0)

function renderTrend(){
  const ks = ["PP","PSOE","VOX","FA","POD","SALF"], idx = {PP:1,PSOE:2,VOX:3,FA:4,POD:5,SALF:6};
  const months = [...new Set(TREND.map(r=>r[0]))].sort((a,b)=>a-b);
  const series = {}; ks.forEach(k => series[k] = months.map(m => { const v = TREND.filter(r=>r[0]===m && r[idx[k]]!=null).map(r=>r[idx[k]]); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; }));
  const W=720, H=300, L=36, Rr=128, T=14, B=28, ymax=40;
  const x = i => L + i*(W-L-Rr)/(months.length-1), y = v => T + (H-T-B)*(1 - v/ymax);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución mensual de la estimación de voto en 2026">`;
  [0,10,20,30,40].forEach(g => { s += `<line x1="${L}" x2="${W-Rr}" y1="${y(g)}" y2="${y(g)}" stroke-width="1" style="stroke:var(--line)"/><text x="${L-8}" y="${y(g)+4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${g}%</text>`; });
  months.forEach((m,i)=>{ s += `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${MONTHS[m-1].replace(".","")}</text>`; });
  const ends = [];
  ks.forEach(k => { const pts = series[k].map((v,i)=> v==null?null:[x(i),y(v)]).filter(Boolean);
    s += `<polyline fill="none" stroke="${color(k)}" stroke-width="${k==="PP"||k==="PSOE"||k==="VOX"?3:2}" stroke-linejoin="round" points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(",")).join(" ")}"/>`;
    series[k].forEach((v,i)=>{ if(v!=null) s += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${color(k)}"><title>${sname(k)} · ${MONTHS[months[i]-1]}: ${fmt(v)}%</title></circle>`; });
    const lv = series[k][series[k].length-1]; ends.push({k, v:lv, y:y(lv)}); });
  ends.sort((a,b)=>a.y-b.y); for (let i=1;i<ends.length;i++) if (ends[i].y - ends[i-1].y < 13) ends[i].y = ends[i-1].y + 13;
  ends.forEach(e => { s += `<text x="${W-Rr+8}" y="${(e.y+4).toFixed(1)}" font-size="12" font-weight="700" style="fill:var(--ink)"><tspan fill="${color(e.k)}">●</tspan> ${esc(sname(e.k))} ${fmt(e.v)}</text>`; });
  $("#trend").innerHTML = s + "</svg>";
}

let seatRowsAll = false, pollParty = "PP";
function tipOn(root){

  $$("[data-tip]", root).forEach(el => {
    const showT = e => { tip.innerHTML = el.dataset.tip; tip.hidden = false; const r = el.getBoundingClientRect(); const x = (e && e.clientX!=null) ? e.clientX : r.left + r.width/2; const tw = tip.offsetWidth; tip.style.left = Math.max(8, Math.min(window.innerWidth - tw - 8, x - tw/2)) + "px"; tip.style.top = (r.top + window.scrollY - tip.offsetHeight - 8) + "px"; };
    el.addEventListener("mousemove", showT); el.addEventListener("mouseenter", showT); el.addEventListener("focus", showT);
    el.addEventListener("mouseleave", ()=> tip.hidden = true); el.addEventListener("blur", ()=> tip.hidden = true);

function seatBar(t, label){

}
function isDark(hex){ const h = hex.replace("#",""); const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16); return (0.299*r + 0.587*g + 0.114*b) < 150; }
function renderSeatRows(){
  const el = $("#seat-rows"); if (!el) return;
  const A = average(includeCIS), avgT = simulate(A.avg).totals;

/* ---------- Probabilidad de mayoría (simulación) ---------- */
const MC_RUNS = 1000, MC_CHUNK = 100;
const MC_S0 = {PP:1.5, PSOE:1.5, VOX:1.0, FA:0.8, POD:0.5, SALF:0.5}; // error común a todas las encuestas (puntos)
const MC_BLOC = 1.5;                                                  // error compartido derecha/izquierda (puntos)
const mcCache = new Map(), mcPending = new Map(); let mcCurrent = null;
function mcSD(){
  const set = latestPerFirm(false), out = {__bloc: MC_BLOC};
  MAIN6.forEach(k => {
    const v = set.map(p => k==="FA" && p.FA!=null ? p.FA + (p.CFV||0) : p[k]).filter(x => x!=null);
    const m = v.reduce((a,b)=>a+b,0) / (v.length||1);
    const sdF = v.length > 2 ? Math.sqrt(v.reduce((a,x)=>a+(x-m)*(x-m),0)/(v.length-1)) : 1;
    out[k] = Math.sqrt(sdF*sdF + MC_S0[k]*MC_S0[k]);
  });
  return out;
}
function mcBase(t){ const b = {}; MODEL_PARTIES.forEach(k => { if (t[k] != null && !(k==="CFV" && !(t.CFV>0)) && k !== "UPC") b[k] = +t[k]; }); return b; }
function mcSummary(runs){
  const n = runs.length, fr = f => runs.filter(f).length / n;
  const inv = BLOCS.find(b=>b.id==="inv23").ks;
  const q = (arr, p) => { const a = arr.slice().sort((x,y)=>x-y); return a[Math.floor(p*(a.length-1))]; };
  const ser = {PP: runs.map(t=>t.PP), PSOE: runs.map(t=>t.PSOE), VOX: runs.map(t=>t.VOX), FA: runs.map(t=>(t.FA||0)+(t.CFV||0)+(t.UPC||0)), POD: runs.map(t=>t.POD||0), RIGHT: runs.map(t=>t.PP+t.VOX+(t.UPN||0))};
  const iv = {}; Object.entries(ser).forEach(([k,a]) => iv[k] = [q(a,.1), q(a,.5), q(a,.9)]);
  const hist = {}; ser.RIGHT.forEach(v => hist[v] = (hist[v]||0) + 1);
  return {n, pRight: fr(t=>t.PP+t.VOX>=176), pRightU: fr(t=>t.PP+t.VOX+(t.UPN||0)>=176), pPP: fr(t=>t.PP>=176), pFirst: fr(t=>t.PP>t.PSOE), pInv: fr(t=>sumOf(t,inv)>=176), iv, hist};
}
function runProb(t, cb){
  const base = mcBase(t), key = JSON.stringify(base);
  if (mcCache.has(key)) { cb(mcCache.get(key)); return; }
  if (mcPending.has(key)) { mcPending.get(key).push(cb); return; }
  mcPending.set(key, [cb]);
  const keep = key === JSON.stringify(mcBase(average(false).avg)); // la media no se cancela nunca
  if (!keep) mcCurrent = key;
  const sd = mcSD(), runs = []; let i = 0;
  const step = () => {
    if (!keep && mcCurrent !== key) { mcPending.delete(key); return; } // el usuario ha cambiado de escenario
    runs.push(...monteCarlo(base, sd, MC_CHUNK, 29112026 + i)); i++;
    if (i * MC_CHUNK < MC_RUNS) { setTimeout(step, 0); return; }
    const s = mcSummary(runs); s.sd = sd; mcCache.set(key, s);
    const cbs = mcPending.get(key) || []; mcPending.delete(key); cbs.forEach(f => f(s));
  };
  setTimeout(step, 20);
}
const pct = p => p > 0.99 ? "Más del 99%" : p < 0.01 ? "Menos del 1%" : Math.round(p*100) + "%";
const pctS = p => p > 0.99 ? ">99%" : p < 0.01 ? "<1%" : Math.round(p*100) + "%";
let probOn = "avg";
function renderProb(){
  const box = $("#prob"); if (!box) return;
  const isAvg = !simT || simT.__key === "avg", is23 = simT && simT.__key === "2023";
  if (!isAvg && probOn !== "sim") { probOn = "avg"; }
  const target = probOn === "sim" && !isAvg && !is23 ? simT : average(false).avg;
  const lbl = target === simT ? `Escenario del simulador (${simLabel})` : "Media de encuestas (sin CIS)";
  box.innerHTML = `<div class="row" style="justify-content:space-between"><span class="eyebrow">${esc(lbl)}</span>${!isAvg && !is23 ? `<button class="linkbtn" id="prob-sw">${probOn==="sim" ? "Volver a la media de encuestas" : "Calcular con el escenario de arriba"}</button>` : ""}</div><p class="small muted">Calculando…</p>`;

function probHTML(s, lbl, isAvg, is23){
  const tiles = [
    ["PP + Vox suman 176 o más", s.pRight, color("PP")],
    ["El PP gana en escaños al PSOE", s.pFirst, color("PP")],
    ["El PP llega solo a 176", s.pPP, color("PP")],
    ["El bloque de la investidura de 2023 suma 176", s.pInv, color("PSOE")]
  ];

  const W = 600, H = 140, nb = hi - lo + 1, bw = W / nb, mx = Math.max(...Object.values(s.hist));
  const bars = [];
  for (let v = lo; v <= hi; v++) { const c = s.hist[v] || 0; if (!c) continue; const h = (H - 6) * c / mx; bars.push(`<rect x="${((v-lo)*bw).toFixed(2)}" y="${(H - h).toFixed(1)}" width="${Math.max(0.5, bw*0.82).toFixed(2)}" height="${h.toFixed(1)}" fill="${v>=176 ? color("PP") : "var(--muted)"}" opacity="${v>=176?1:.55}"><title>${v} escaños: ${c} de ${s.n} simulaciones</title></rect>`); }

  const ticks = []; for (let v = Math.ceil(lo/10)*10; v <= hi; v += 10) ticks.push(`<span style="left:${xp(v)}%">${v}</span>`);
  const ivRow = (k, name, c) => `<tr><td><i class="dot" style="background:${c}"></i>${esc(name)}</td><td class="num"><b>${s.iv[k][1]}</b></td><td class="num">${s.iv[k][0]}–${s.iv[k][2]}</td></tr>`;
  return `<div class="row" style="justify-content:space-between"><span class="eyebrow">${esc(lbl)}</span>${!isAvg && !is23 ? `<button class="linkbtn" id="prob-sw">${probOn==="sim" ? "Volver a la media de encuestas" : "Calcular con el escenario de arriba"}</button>` : ""}</div>
    <div class="tiles">${tiles.map(([t,p,c]) => `<div class="tile" style="--pc:${c}"><div class="n num">${pctS(p)}</div><div class="d">${esc(t)}</div></div>`).join("")}</div>
    <div class="stack" style="gap:6px"><span class="eyebrow">Escaños de PP + Vox + UPN en las ${s.n.toLocaleString("es-ES")} simulaciones</span>
      <div class="prob-hist"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Distribución de escaños de PP, Vox y UPN; en azul, los casos con mayoría absoluta">${bars.join("")}</svg><i class="maj176" style="left:${(((176 - lo) / nb) * 100).toFixed(2)}%"><b>176</b></i><div class="hist-axis">${ticks.join("")}</div></div>
    </div>
    <div class="table-wrap"><table class="prob-table"><thead><tr><th>Partido</th><th>Mediana</th><th>8 de cada 10</th></tr></thead><tbody>
      ${ivRow("PP","PP",color("PP"))}${ivRow("PSOE","PSOE",color("PSOE"))}${ivRow("VOX","Vox",color("VOX"))}${ivRow("FA","FA + Compromís + UPC",color("FA"))}${ivRow("POD","Podemos",color("POD"))}${ivRow("RIGHT","PP + Vox + UPN",color("PP"))}
    </tbody></table></div>
    <p class="note">Cómo calculamos: en cada simulación movemos el voto nacional de cada partido con un error al azar. Su tamaño suma lo que discrepan entre sí las encuestas (la desviación entre la última de cada empresa) y un error común a todas, porque pueden fallar a la vez (en 2023 casi todas se quedaron cortas con el PSOE): de ±1,5 puntos para PP y PSOE, ±1 para Vox, ±0,8 para FA y ±0,5 para Podemos y SALF. Añadimos un error compartido de ±1,5 puntos que pasa voto de la derecha a la izquierda o al revés, y un ruido de cada partido en cada provincia (±6%). Luego repartimos los escaños con el mismo modelo. Desviaciones usadas ahora: ${MAIN6.map(k=>`${esc(sname(k))} ±${fmt(s.sd[k])}`).join(", ")}. No es una predicción: solo dice cuánto pesa el margen de error de las encuestas.</p>`;
}

function md(text){
  const lines = esc(text).split(/\n/); let out = "", list = null;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  lines.forEach(l => {
    let m;
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list!=="ul"){ close(); out+="<ul>"; list="ul"; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list!=="ol"){ close(); out+="<ol>"; list="ol"; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^#{1,4}\s+(.*)/))) { close(); out += `<h4>${inline(m[1])}</h4>`; }
    else if (!l.trim()) { close(); }
    else { close(); out += `<p>${inline(l)}</p>`; }
  });
  close(); return out;
}

async function send(q){
  if (busy) return;
  if (!sampleFn) { const n = $("#chat-note"); if (n) n.innerHTML = "<b>La consulta a Claude solo funciona al abrir esta página dentro de Claude.</b> El resto de la web funciona igual."; return; }
  const ta = $("#ask"); if (ta) ta.value = "";

  ctl = new AbortController();
  const hist = turns.slice(-10).filter(t=>!t.err).map(t=>({role:t.role, content:t.content}));
  while (hist.length && hist[0].role!=="user") hist.shift();
  try {
    const {text, truncated} = await sampleFn([{role:"user", content:RULES()}, ...hist], {signal: ctl.signal, cache:false, onText: ({text}) => renderMsgs(text)});
    turns.push({role:"assistant", content: text + (truncated ? "\n\n(Respuesta cortada por longitud.)" : "")});

    if (code === "cancelled") { if (e.text) turns.push({role:"assistant", content:e.text}); }
    else { if (e && e.text) turns.push({role:"assistant", content:e.text}); turns.push({role:"assistant", content: ERRS[code] || "Se ha cortado la conexión. Vuelve a intentarlo.", err:true});

  } finally {

      <details><summary>¿Cómo voto por correo?</summary><p>Pídelo en cualquier oficina de Correos con tu DNI o en la web de Correos con certificado digital o DNI electrónico, hasta el 19 de noviembre. Recibirás en casa las papeletas y los sobres. Entrega el voto en Correos como tarde el 25 de noviembre.</p></details>
      <details><summary>¿Qué voto el 29-N?</summary><p>Dos papeletas. Congreso (papeleta blanca): eliges una lista cerrada de un partido. Senado (papeleta sepia): marcas con una cruz hasta tres candidatos en las provincias peninsulares, que eligen 4 senadores cada una.</p></details>
      <details><summary>¿Cómo se reparten los 350 escaños?</summary><p>Cada provincia elige un número fijo de diputados según su población (Madrid 38, Barcelona 32, Soria 2; Ceuta y Melilla, 1). Solo entran en el reparto los partidos con al menos el 3% del voto válido de esa provincia, y los escaños se asignan con la ley D'Hondt: se divide el voto de cada partido entre 1, 2, 3… y se dan los escaños a los cocientes más altos. En el simulador puedes ver la tabla de cada provincia.</p></details>
      <details><summary>¿Qué pasa después del 29-N?</summary><p>Las Cortes se constituyen el 23 de diciembre. El rey propone un candidato, que necesita 176 votos en la primera votación o más síes que noes 48 horas después. Si en dos meses desde la primera votación nadie es investido, se repiten las elecciones.</p></details>
      <details><summary>¿Hasta cuándo hay encuestas?</summary><p>La ley prohíbe publicar sondeos en los cinco días previos a la votación, así que el último día es el 23 de noviembre.</p></details>
    </div>
  </div>
  <section class="stack"><h3>Fuentes</h3><div class="src">${SOURCES.map(([t,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`).join("")}</div>
  <p class="small muted">Las fuentes de cada partido aparecen en su ficha. Datos recopilados el ${UPDATED}.</p></section>`;
}

function goLinks(){ document.addEventListener("click", e => { const g = e.target.closest("[data-go]"); if (g) { if (g.dataset.mapmode) mapMode = g.dataset.mapmode; show(g.dataset.go, true); } }); }
function boot(){
  renderTabs(); renderCount(); goLinks();
  renderResumen(); renderPartidos(); renderComparar(); renderEncuestas(); renderGrupos(); renderMinoritarios(); renderEscanos(); if (!SITE) renderPregunta(); renderCalendario();
  const h = (location.hash||"").replace("#","");
  show(h || "resumen", false);
  window.addEventListener("hashchange", ()=> show((location.hash||"").replace("#",""), false));
  if (SITE) { const s = $("#v-pregunta"); if (s) s.remove(); }
  else if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("sample").then(fn => { sampleFn = fn || null; if (!fn) { const n=$("#chat-note"); if (n) n.innerHTML = "<b>La consulta a Claude solo funciona al abrir esta página dentro de Claude.</b> El resto de la web funciona igual."; } }).catch(()=>{ sampleFn = null; });
  } else { const n=$("#chat-note"); if (n) n.innerHTML = "<b>La consulta a Claude solo funciona al abrir esta página dentro de Claude.</b> El resto de la web funciona igual."; }
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
